<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e6d9c7">
<title>Para Mileidi</title>
<!--
  ============================================================
   PARA PERSONALIZAR: todo lo editable (nombres, foto, carta)
   está en el objeto CONFIG, al principio del <script> de abajo.
  ============================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #a9c6de;
    --azul-claro: #cfe0ee;
    --azul-hondo: #7e9fbc;
    --papel: #f8f0e1;
    --papel-sombra: #eadcc3;
    --tinta: #4b3a2e;
    --tinta-suave: #8a7260;
    --cobre: #a8673f;
    --oro-1: #9d7029;
    --oro-2: #e9cb7c;
    --oro-3: #fff0c2;
    --rosa: #e7a3ae;

    --serif-titulo: "Playfair Display", "Times New Roman", Georgia, serif;
    --serif-texto: "Lora", Georgia, serif;

    /* Tamaño del libro: se adapta al celular en vertical */
    --w: min(88vw, 400px, calc((100vh - 110px) / 1.55));
    --h: calc(var(--w) * 1.55);
    --giro-tapa: 1.5s;
    --giro-hoja: 1.1s;
  }
  @supports (height: 100svh) {
    :root { --w: min(88vw, 400px, calc((100svh - 110px) / 1.55)); }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(85% 60% at 50% 44%, #f4ead9 0%, #e2d1b7 38%, #a88e72 78%, #6d5643 100%);
    color: var(--tinta);
    font-family: var(--serif-texto);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  /* grano de papel sobre el fondo */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: var(--ruido);
    opacity: .35; mix-blend-mode: multiply;
  }
  :root {
    --ruido: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .27  0 0 0 0 .18  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  #polvo { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .vineta {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(75% 55% at 50% 46%, transparent 40%, rgba(45,30,18,.45) 100%);
    transition: opacity 2s ease; opacity: .7;
  }
  body.leyendo .vineta { opacity: 1; }
  .escena {
    z-index: 2;
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 34px;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }

  /* ---------- LIBRO ---------- */
  /* el libro como objeto 3D: cerrado se ve inclinado, al abrirlo se endereza */
  .mesa {
    position: relative;
    perspective: 1100px;
    perspective-origin: 50% -10%;
    opacity: 0; transform: translateY(30px) scale(.96);
  }
  body.listo .mesa { animation: llegar 2s cubic-bezier(.2,.7,.2,1) .4s forwards; }
  @keyframes llegar { to { opacity: 1; transform: none; } }
  /* sombra que proyecta el libro sobre la mesa */
  .mesa::before {
    content: ""; position: absolute; left: 6%; right: -4%; top: 6%; bottom: -3%;
    background: rgba(45,28,14,.55); border-radius: 6px;
    filter: blur(22px);
    transform: translate(calc(var(--sx, 0) * 1px + 14px), 20px);
    transition: opacity 1.5s ease;
  }
  .volumen {
    --d: calc(var(--w) * .11);
    position: relative;
    width: var(--w); height: var(--h);
    transform-style: preserve-3d;
    transform: scale(.93) rotateX(-7deg) rotateY(-18deg);
  }
  .libro {
    position: absolute; inset: 0;
    perspective: 2400px;
    cursor: pointer;
  }
  .volumen.abierto .lado { opacity: 0; transition: opacity .4s ease 1.1s; }
  .lado { position: absolute; -webkit-backface-visibility: hidden; backface-visibility: hidden; pointer-events: none; }
  .lomo3d {
    left: calc(-1 * var(--d)); top: -4px;
    width: var(--d); height: calc(var(--h) + 8px);
    transform-origin: right center; transform: rotateY(-90deg);
    border-radius: 4px 0 0 4px;
    background:
      linear-gradient(90deg, rgba(30,55,85,.45), rgba(255,255,255,.16) 42%, rgba(30,55,85,.22) 75%, rgba(30,55,85,.4)),
      #98b9d4;
    overflow: hidden;
  }
  .lomo3d::before {
    content: ""; position: absolute; inset: 0;
    background-image: var(--ruido); opacity: .55; mix-blend-mode: multiply;
  }
  .lomo3d svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .lomo3d .titulo-lomo {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%) rotate(90deg);
    white-space: nowrap;
    font-family: var(--serif-titulo); font-style: italic;
    font-size: calc(var(--d) * .36); color: #2b4562;
    text-shadow: 0 1px 0 rgba(255,255,255,.3);
  }
  .canto-sup, .canto-inf {
    left: 0; width: calc(var(--w) + 5px); height: var(--d);
    background:
      linear-gradient(0deg, #8aabc8 0 7%, rgba(40,25,10,.25) 7% 9%, transparent 9% 91%, rgba(40,25,10,.2) 91% 93%, #7d9dba 93%),
      linear-gradient(90deg, rgba(60,40,20,.25), transparent 8%, transparent 92%, rgba(60,40,20,.2)),
      repeating-linear-gradient(0deg, #f5ecdb 0 1px, #e4d6be 1px 2px, #efe5d1 2px 3px),
      var(--papel);
  }
  .canto-sup, .canto-inf { -webkit-backface-visibility: visible; backface-visibility: visible; }
  .canto-sup { top: calc(-4px - var(--d)); transform-origin: bottom center; transform: rotateX(90deg); }
  .canto-inf { top: calc(100% + 4px); transform-origin: top center; transform: rotateX(-90deg); }
  .canto-der {
    left: calc(100% + 5px); top: -4px; width: var(--d); height: calc(var(--h) + 8px);
    transform-origin: left center; transform: rotateY(90deg);
    border-radius: 0 3px 3px 0;
    background:
      linear-gradient(90deg, #8aabc8 0 7%, rgba(40,25,10,.25) 7% 9%, transparent 9% 91%, rgba(40,25,10,.2) 91% 93%, #7d9dba 93%),
      linear-gradient(180deg, rgba(60,40,20,.25), transparent 5%, transparent 95%, rgba(60,40,20,.25)),
      repeating-linear-gradient(90deg, #f5ecdb 0 1px, #e4d6be 1px 2px, #efe5d1 2px 3px),
      var(--papel);
  }
  .contratapa {
    left: 0; top: -4px; width: calc(100% + 5px); height: calc(100% + 8px);
    transform: translateZ(calc(-1 * var(--d)));
    border-radius: 3px 8px 8px 3px;
    background: linear-gradient(90deg, #87a8c4, #9cbcd6 60%, #7d9dba);
    box-shadow: inset -2px 0 3px rgba(30,55,85,.4);
  }

  /* sombra de contacto sobre la mesa */
  .libro::before {
    content: ""; position: absolute; left: 4%; right: -2%; bottom: -5%; height: 10%;
    background: radial-gradient(50% 50% at 50% 50%, rgba(70,45,20,.32), transparent 70%);
    filter: blur(6px); z-index: -2;
  }

  /* canto de las páginas (grosor del libro) */
  .canto {
    position: absolute; inset: 0; border-radius: 2px 4px 4px 2px;
    background: var(--papel-sombra);
    transition: box-shadow 1s ease .8s;
  }
  .volumen.abierto .canto {
    box-shadow:
      1px 1px 0 #f6eddc, 2px 2px 0 #d8c9ae, 3px 3px 0 #f3e9d6, 4px 4px 0 #d3c3a7,
      5px 5px 0 #efe4cf, 6px 6px 0 #cbb99b, 7px 7px 0 #8fa9c1,
      0 2px 3px rgba(60,40,20,.18), 4px 18px 28px -10px rgba(60,40,20,.4);
    z-index: 0;
  }

  .hoja, .pagina-fija {
    position: absolute; inset: 0;
    transform-origin: left center;
    transform-style: preserve-3d;
  }
  .hoja { transition: transform var(--giro-hoja) cubic-bezier(.55,.06,.3,1); }
  .hoja.volteada { transform: rotateY(-180deg); }

  .cara {
    position: absolute; inset: 0; overflow: hidden;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    border-radius: 2px 5px 5px 2px;
  }
  .cara.reverso { transform: rotateY(180deg); border-radius: 5px 2px 2px 5px; }

  /* papel crema */
  .papel {
    background:
      linear-gradient(90deg, rgba(110,75,40,.20) 0%, rgba(110,75,40,.06) 4%, transparent 10%),
      radial-gradient(120% 80% at 70% 30%, rgba(255,252,244,.7), transparent 70%),
      radial-gradient(40% 25% at 88% 92%, rgba(190,150,100,.10), transparent 70%),
      var(--papel);
  }
  .papel::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: var(--ruido); opacity: .22; mix-blend-mode: multiply;
  }
  .cara.reverso.papel {
    background:
      linear-gradient(270deg, rgba(110,75,40,.20) 0%, rgba(110,75,40,.06) 4%, transparent 10%),
      var(--papel);
  }

  /* sombra que recorre la hoja mientras gira */
  .cara::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: linear-gradient(90deg, transparent 30%, rgba(70,45,20,.28) 100%);
  }
  .cara.reverso::after { background: linear-gradient(270deg, transparent 30%, rgba(70,45,20,.28) 100%); }
  .hoja.girando .cara::after { animation: sombra-giro var(--giro-hoja) ease-in-out; }
  .tapa.girando .cara::after { animation-duration: var(--giro-tapa); }
  @keyframes sombra-giro { 0%,100% { opacity: 0; } 50% { opacity: 1; } }

  /* ---------- TAPA ---------- */
  .tapa {
    inset: -4px -5px -4px 0;
    transition-duration: var(--giro-tapa);
    transition-timing-function: cubic-bezier(.6,.02,.25,1);
  }
  /* cuero azul pastel envejecido */
  .tela {
    background:
      radial-gradient(60% 45% at 56% 48%, rgba(255,255,255,.28), transparent 70%),
      radial-gradient(30% 22% at 30% 30%, rgba(225,238,248,.35), transparent 70%),
      radial-gradient(26% 18% at 74% 70%, rgba(90,125,160,.20), transparent 70%),
      radial-gradient(22% 16% at 40% 78%, rgba(225,238,248,.30), transparent 70%),
      radial-gradient(18% 14% at 78% 26%, rgba(90,125,160,.18), transparent 70%),
      radial-gradient(120% 100% at 55% 50%, transparent 55%, rgba(55,90,125,.35) 100%),
      #a2c2dc;
    box-shadow: inset 0 0 0 1px rgba(50,80,115,.35), inset 0 0 30px rgba(45,75,110,.4);
  }
  .tela::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: var(--ruido); opacity: .55; mix-blend-mode: multiply;
  }
  .tela .moteado {
    position: absolute; inset: 0; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='620' viewBox='0 0 400 620' preserveAspectRatio='none'><filter id='m'><feTurbulence type='fractalNoise' baseFrequency='.011 .008' numOctaves='4' seed='11'/><feColorMatrix values='0 0 0 0 .16  0 0 0 0 .28  0 0 0 0 .42  0 0 0 1.5 -.55'/></filter><rect width='100%' height='100%' filter='url(%23m)'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='g'><feTurbulence type='turbulence' baseFrequency='.35' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .2  0 0 0 0 .32  0 0 0 0 .45  0 0 0 .9 -.25'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>");
    background-size: 100% 100%, 180px 180px;
    opacity: .55; mix-blend-mode: multiply;
  }
  /* lomo y bisagra */
  .tapa .frente .lomo {
    position: absolute; top: 0; bottom: 0; left: 0; width: 10.5%;
    background: linear-gradient(90deg,
      rgba(35,65,100,.38) 0%, rgba(255,255,255,.10) 30%, rgba(35,65,100,.16) 60%,
      rgba(35,65,100,.42) 88%, rgba(255,255,255,.22) 94%, rgba(35,65,100,.10) 100%);
  }
  .tapa .adornos { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tapa .brillo {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(108deg, transparent 38%, rgba(255,255,255,.55) 50%, transparent 62%);
    background-size: 320% 100%;
    background-position: var(--brillo, 60%) 0;
    mix-blend-mode: soft-light;
  }
  .tapa .bisel {
    position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    box-shadow: inset 2px 2px 2px rgba(255,255,255,.28), inset -3px -3px 4px rgba(25,50,80,.35);
  }
  .cinta-libro {
    position: absolute; left: 22%; bottom: -9%; width: 5.5%; height: 16%;
    transform-origin: 50% 0;
    background: linear-gradient(90deg, #b96b7c, #eab0bb 40%, #f6ccd3 50%, #d58e9d 65%, #ac5d6f);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 88%, 0 100%);
    animation: mecer 5s ease-in-out infinite;
    z-index: 1;
  }
  @keyframes mecer { 0%,100% { transform: rotate(1.5deg); } 50% { transform: rotate(-2deg); } }
  .oro {
    background: linear-gradient(100deg, #94672a 0%, #e5c477 20%, #fff0c4 30%, #c8973f 46%, #8d6424 60%, #e0bd6c 80%, #a47732 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 .8px .4px rgba(25,45,75,.55)) drop-shadow(0 -.5px 0 rgba(255,255,255,.35));
  }
  .portada {
    position: absolute; top: 15%; bottom: 25%; left: 17.5%; right: 6.25%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 9%;
  }
  .portada .monograma {
    position: absolute; top: 2%;
    font-family: var(--serif-titulo); font-size: calc(var(--w) * .034);
    letter-spacing: .34em; text-transform: uppercase;
  }
  .portada h1 {
    font-family: var(--serif-titulo); font-style: italic; font-weight: 500;
    font-size: calc(var(--w) * .1); line-height: 1.08;
  }
  .portada .sub {
    font-family: var(--serif-titulo); font-style: italic;
    font-size: calc(var(--w) * .056); line-height: 1.3; margin-top: .2em;
  }
  .portada .onda { width: 32%; margin: calc(var(--w) * .035) 0; color: #2b4562; opacity: .75; }
  .tinta-tapa {
    color: #2b4562;
    text-shadow: 0 1px 0 rgba(255,255,255,.4), 0 -1px 0 rgba(20,40,65,.18);
  }
  /* guarda (interior de la tapa) */
  .guarda {
    background:
      radial-gradient(circle at 25% 25%, rgba(255,255,255,.35) 0 1.5px, transparent 2px),
      radial-gradient(circle at 75% 75%, rgba(255,255,255,.35) 0 1.5px, transparent 2px),
      var(--azul-claro);
    background-size: 22px 22px, 22px 22px, auto;
  }
  .guarda::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(270deg, rgba(40,70,100,.25), transparent 12%);
  }
  .exlibris {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 58%; padding: 8% 6%;
    background: var(--papel); text-align: center;
    border: 1px solid rgba(157,112,41,.5); outline: 1px solid rgba(157,112,41,.25); outline-offset: -5px;
    font-family: var(--serif-titulo); font-style: italic; color: var(--tinta-suave);
    font-size: calc(var(--w) * .04); line-height: 1.5;
  }
  .exlibris b { display: block; font-style: normal; font-weight: 400; letter-spacing: .25em; text-transform: uppercase; font-size: .7em; margin-bottom: .4em; }

  /* ---------- PÁGINAS INTERIORES ---------- */
  .contenido {
    position: absolute; inset: 0;
    padding: 11% 10% 13% 13%;
    display: flex; flex-direction: column;
    font-size: calc(var(--w) * .043);
    line-height: 1.62;
  }
  .contenido p { margin-bottom: .85em; text-wrap: pretty; hyphens: manual; }
  .titulo-pagina {
    font-family: var(--serif-titulo); font-style: italic; font-weight: 400;
    color: var(--cobre); font-size: 1.55em; line-height: 1.2;
    text-align: center; margin-bottom: .2em;
  }
  .antetitulo {
    font-family: var(--serif-titulo); text-transform: uppercase; letter-spacing: .3em;
    font-size: .62em; color: var(--tinta-suave); text-align: center;
  }
  .onda { display: block; width: 26%; height: auto; margin: .5em auto 1em; color: var(--oro-1); opacity: .75; }
  .saludo { font-style: italic; color: var(--cobre); font-size: 1.06em; }
  .carta p:not(.saludo) { font-size: .96em; }
  .firma {
    margin-top: auto; text-align: right;
    font-style: italic; color: var(--tinta-suave);
  }
  .firma span {
    display: block; font-family: var(--serif-titulo); font-style: italic;
    font-size: 1.5em; color: var(--cobre); margin-top: .1em;
  }
  .folio {
    position: absolute; left: 13%; right: 10%; bottom: 5%;
    display: flex; justify-content: center; align-items: center;
    font-family: var(--serif-titulo); font-style: italic; font-size: calc(var(--w) * .032);
    color: var(--tinta-suave); opacity: .85;
  }
  .folio .pasar {
    position: absolute; right: 0;
    font-size: .95em; animation: latido 2.6s ease-in-out infinite;
  }
  @keyframes latido { 0%,100% { opacity: .35; transform: translateX(0); } 50% { opacity: .9; transform: translateX(3px); } }
  .esquina {
    position: absolute; width: 30%; pointer-events: none; opacity: .92;
  }
  .esquina.sup-der { top: -3%; right: -7%; transform: rotate(200deg) scale(.95); }
  .esquina.inf-der { bottom: -4%; right: -6%; transform: rotate(-10deg); }
  .esquina.inf-izq { bottom: -4%; left: 1%; transform: scaleX(-1) rotate(-10deg); width: 26%; }

  /* polaroid */
  .pag-foto .contenido { align-items: center; }
  .polaroid {
    position: relative;
    width: min(80%, calc(var(--h) * .44));
    margin-top: .6em;
    padding: 5.5% 5.5% 0;
    background: #fcfbf7;
    transform: rotate(-2.6deg);
    box-shadow:
      0 1px 1px rgba(60,40,20,.15),
      0 6px 10px -4px rgba(60,40,20,.25),
      0 18px 26px -16px rgba(60,40,20,.35);
  }
  .polaroid::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(160deg, rgba(255,255,255,.35), transparent 40%);
  }
  .polaroid .marco-foto {
    position: relative; aspect-ratio: 1 / 1.02; overflow: hidden;
    background: #d9cdb8;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
  }
  .polaroid img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    filter: saturate(.92) contrast(1.02) sepia(.06);
  }
  .polaroid .sin-foto {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; text-align: center; padding: 12%;
    font-family: var(--serif-titulo); font-style: italic; color: var(--tinta-suave);
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.25) 0 6px, transparent 6px 12px),
      linear-gradient(160deg, var(--azul-claro), #e9d7c9);
    font-size: .9em;
  }
  .polaroid.vacia .sin-foto { display: flex; }
  .polaroid.vacia img { display: none; }
  .polaroid figcaption {
    font-family: var(--serif-titulo); font-size: 1.05em; text-align: center;
    padding: .55em 0 .7em; color: var(--tinta);
  }
  .cinta {
    position: absolute; top: -4%; width: 34%; height: 9%;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.25) 0 3px, transparent 3px 7px),
      rgba(176,204,228,.72);
    clip-path: polygon(0 8%, 4% 0, 8% 10%, 12% 0, 16% 8%, 100% 0, 96% 12%, 100% 24%, 96% 38%, 100% 52%, 96% 66%, 100% 80%, 96% 92%, 100% 100%, 0 100%, 4% 86%, 0 72%, 4% 58%, 0 44%, 4% 30%, 0 18%);
    mix-blend-mode: multiply;
  }
  .cinta.izq { left: -8%; transform: rotate(-38deg); }
  .cinta.der { right: -8%; transform: rotate(36deg); }
  .nota-foto {
    margin-top: auto; text-align: center; font-style: italic; color: var(--tinta-suave);
    font-size: .95em;
  }

  /* pregunta */
  .pag-pregunta .contenido { justify-content: center; text-align: center; align-items: center; }
  .epigrafe {
    font-style: italic; color: var(--tinta-suave); font-size: .9em; line-height: 1.55;
    max-width: 92%;
  }
  .epigrafe::before, .epigrafe::after { color: var(--oro-1); }
  .pregunta-nombre {
    font-family: var(--serif-titulo); font-style: italic; font-size: 1.5em;
    color: var(--tinta); margin-top: .6em;
  }
  .pregunta {
    font-family: var(--serif-titulo); font-style: italic; font-weight: 500;
    font-size: 2.05em; line-height: 1.15; color: var(--cobre);
    margin: .15em 0 1.1em;
  }
  .boton-si {
    position: relative;
    font-family: var(--serif-titulo); font-style: italic; font-size: 1.18em;
    padding: .72em 1.9em .78em;
    border: 0; border-radius: 3px;
    cursor: pointer;
    color: #fffaf0;
    text-shadow: 0 1px 1px rgba(40,65,95,.45);
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(35,60,95,.07) 0 1px, transparent 1px 3px),
      linear-gradient(180deg, #a3c1db, #8eaecb 60%, #86a7c5);
    box-shadow:
      inset 0 0 0 1px rgba(60,90,120,.3),
      inset 0 0 0 4px #93b3cf,
      inset 0 0 0 5px rgba(201,160,80,.8),
      0 1px 0 rgba(255,255,255,.6),
      0 3px 6px -2px rgba(60,40,20,.35);
    transition: transform .2s ease, box-shadow .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .boton-si span { display: inline-block; }
  .boton-si:active { transform: translateY(1px) scale(.98); }
  .boton-si.dicho { pointer-events: none; }
  .boton-si:focus-visible { outline: 2px solid var(--cobre); outline-offset: 4px; }

  /* capítulo 1 */
  .pag-capitulo .contenido { text-align: center; align-items: center; justify-content: flex-start; padding-top: 13%; }
  .capitulo-num {
    font-family: var(--serif-titulo); font-style: italic; font-weight: 400;
    font-size: 2.6em; line-height: 1; color: var(--cobre);
  }
  .capitulo-nombres { font-family: var(--serif-titulo); font-size: 1.12em; margin-top: .2em; }
  .capitulo-fecha { font-style: italic; color: var(--tinta-suave); font-size: .95em; }
  .contador-titulo {
    font-family: var(--serif-titulo); font-style: italic; color: var(--tinta-suave);
    font-size: 1.15em; margin-top: 1.4em;
  }
  .contador {
    display: grid; grid-template-columns: repeat(4, 1fr); width: 100%;
    margin-top: .6em; padding: .9em 0 .8em;
    border-top: 1px solid rgba(157,112,41,.35); border-bottom: 1px solid rgba(157,112,41,.35);
  }
  .contador div { display: flex; flex-direction: column; align-items: center; }
  .contador strong {
    font-family: var(--serif-titulo); font-weight: 500; font-size: 1.9em; line-height: 1.05;
    font-variant-numeric: lining-nums tabular-nums; color: var(--tinta);
  }
  .contador small {
    font-family: var(--serif-titulo); font-size: .52em; letter-spacing: .22em;
    text-transform: uppercase; color: var(--tinta-suave); margin-top: .5em;
  }
  .capitulo-cierre { margin-top: 1.4em; font-style: italic; color: var(--tinta-suave); font-size: .95em; }
  .capitulo-cierre em { display: block; font-family: var(--serif-titulo); color: var(--cobre); font-size: 1.35em; margin-top: .15em; }

  /* pista inicial */
  .pista {
    font-family: var(--serif-titulo); font-style: italic; color: #f6ecdc;
    text-shadow: 0 1px 6px rgba(40,25,10,.6);
    font-size: 15px; letter-spacing: .02em;
    opacity: 0;
    transition: opacity .6s ease;
    display: flex; align-items: center; gap: 10px;
    min-height: 22px;
  }
  .pista::before, .pista::after { content: ""; width: 22px; height: 1px; background: currentColor; opacity: .5; }
  body.listo .pista { animation: aparecer 1.2s ease 2.8s forwards; }
  .pista.oculta { opacity: 0 !important; animation: none; }
  @keyframes aparecer { to { opacity: .85; } }
  .pista span { animation: respirar 2.8s ease-in-out 3s infinite; }
  @keyframes respirar { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

  /* intro */
  .intro {
    position: fixed; inset: 0; z-index: 80;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: 24px; text-align: center;
    background: radial-gradient(90% 70% at 50% 45%, #2b2019 0%, #160f0b 75%);
    color: #efe2cc; cursor: pointer;
    transition: opacity 1.6s ease, visibility 0s linear 1.6s;
  }
  .intro::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: var(--ruido); opacity: .25; mix-blend-mode: screen;
  }
  .intro.fuera { opacity: 0; visibility: hidden; }
  .intro-linea {
    font-family: var(--serif-titulo); font-style: italic; font-size: 22px; line-height: 1.4;
    opacity: 0; transform: translateY(8px); filter: blur(4px);
    animation: linea 1.6s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .intro-linea.l1 { font-style: normal; text-transform: uppercase; letter-spacing: .35em; font-size: 12px; color: #c9a86a; animation-delay: .6s; }
  .intro-linea.l2 { animation-delay: 2s; }
  .intro-linea.l3 { animation-delay: 3.6s; }
  @keyframes linea { to { opacity: 1; transform: none; filter: none; } }
  .intro-empezar {
    margin-top: 26px; background: none; border: 0; color: #efe2cc; cursor: pointer;
    font-family: var(--serif-titulo); font-style: italic; font-size: 15px; letter-spacing: .04em;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    opacity: 0; animation: linea 1.4s ease 5s forwards;
  }
  .intro-empezar i {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid rgba(239,226,204,.5);
    box-shadow: 0 0 0 0 rgba(239,226,204,.4);
    animation: pulso 2.4s ease-out 6s infinite;
  }
  @keyframes pulso { 0% { box-shadow: 0 0 0 0 rgba(239,226,204,.35); } 100% { box-shadow: 0 0 0 22px rgba(239,226,204,0); } }
  .sonido {
    position: fixed; z-index: 60; top: calc(env(safe-area-inset-top) + 14px); right: 14px;
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid rgba(255,248,236,.45); background: rgba(60,40,25,.25);
    color: #fbf3e6; display: grid; place-items: center; cursor: pointer;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    opacity: 0; transition: opacity 1s ease;
  }
  body.listo .sonido { opacity: .85; }
  .sonido svg { width: 18px; height: 18px; }
  .sonido .off { display: none; }
  .sonido.mudo .on { display: none; }
  .sonido.mudo .off { display: inline; }

  /* pétalos */
  #petalos { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
  .petalo {
    position: absolute; top: 0; left: 0;
    border-radius: 60% 0 60% 40% / 70% 0 70% 30%;
    will-change: transform;
  }

  @media (prefers-reduced-motion: reduce) {
    :root { --giro-tapa: .5s; --giro-hoja: .4s; }
    .cinta-libro { animation: none; }
    .folio .pasar, .pista span { animation: none; }
  }
</style>
</head>

<script>
/* =================================================================
   CONFIGURACIÓN — cambia aquí nombres, foto y textos

const CONFIG = {

  ella: "Mileidi",                // ← su nombre

  foto: "foto.jpg",
  pieDeFoto: "Harold & Mileidi",
  tituloFoto: "Una página que ya escribimos",
  notaFoto: "Y todavía quedan muchas por llenar.",

  // Intro (pantalla oscura del principio)
  intro1: "Hay historias que se leen…",
  intro2: "y otras que se escriben juntos.",

  // Portada
  monograma: "H · M",
  tituloPortada: "La vida es un buen libro,",

  tituloLomo: "Harold & Mileidi",

  // ← CARTA: cada texto entre comillas es un párrafo.
  saludo: "Mileidi:",
  cartaPagina1: [
    "Dicen que la vida es un buen libro, y desde que llegaste a la mía siento que por fin empezó la parte que vale la pena leer. Hay capítulos que uno pasa rápido, casi sin darse cuenta; los que tienen tu nombre, en cambio, los leo despacio y los vuelvo a leer.",
    "Me gusta quién soy cuando estoy contigo. Me gusta cómo te ríes, cómo me escuchas y cómo conviertes un día cualquiera en algo que quiero recordar."
  ],
  cartaPagina2: [
    "No sé qué traen las próximas páginas, y está bien. No necesito conocer el final para saber con quién quiero escribirlas: con viajes, domingos lentos, canciones nuestras y alguna discusión que termine en abrazo.",
    "Por eso hoy no te traigo un libro terminado. Te traigo uno abierto, con la tinta lista y muchas hojas en blanco esperándonos a los dos."
  ],
  despedida: "Con todo lo que soy,",
  // la firma usa el nombre de "el"

  // Pregunta y final
  cancion: "La vida es un buen libro, vente pa' que la escribas conmigo",
  boton: "Sí, quiero ♥",
  cierre1: "Y apenas vamos por la primera página.",
  cierre2: "Te quiero.",

  // Fecha de inicio del contador. null = el momento en que toca "Sí, quiero".
  // Para fijarla a mano: "2026-10-24T20:30:00"
  fechaInicio: null
};
/* ================================================================= */

(function () {
  const reducido = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (s, r = document) => r.querySelector(s);
  const libro = $("#libro");
  const pista = $("#pista");
  const hojas = [...document.querySelectorAll(".hoja")].sort((a, b) => a.dataset.i - b.dataset.i);
  const CLAVE = "libro-" + CONFIG.ella + "-" + CONFIG.el;

  /* ---- Rellenar textos ---- */
  document.querySelectorAll("[data-texto]").forEach(el => {
    const v = CONFIG[el.dataset.texto];
    if (v != null) el.textContent = v;
  });
  document.title = "Para " + CONFIG.ella;

  const carta1 = $("#carta-1"), carta2 = $("#carta-2");
  carta1.innerHTML =
    '<p class="antetitulo">Prólogo</p>' +
    '<svg class="onda" viewBox="0 0 120 16"><use href="#onda"/></svg>';
  const saludo = document.createElement("p");
  saludo.className = "saludo"; saludo.textContent = CONFIG.saludo;
  carta1.appendChild(saludo);
  CONFIG.cartaPagina1.forEach(t => { const p = document.createElement("p"); p.textContent = t; carta1.appendChild(p); });
  carta2.innerHTML = '<svg class="onda" viewBox="0 0 120 16" style="margin-top:.2em"><use href="#onda"/></svg>';
  CONFIG.cartaPagina2.forEach(t => { const p = document.createElement("p"); p.textContent = t; carta2.appendChild(p); });
  const firma = document.createElement("p");
  firma.className = "firma"; firma.textContent = CONFIG.despedida;
  const nombre = document.createElement("span"); nombre.textContent = CONFIG.el;
  firma.appendChild(nombre); carta2.appendChild(firma);

  /* ---- Foto ---- */
  const foto = $("#foto"), polaroid = $("#polaroid");
  if (!CONFIG.foto) polaroid.classList.add("vacia");
  else {
    foto.onerror = () => polaroid.classList.add("vacia");
    foto.src = CONFIG.foto;
  }

  /* ---- Ajustar el texto para que quepa en cada página ---- */
  function ajustar() {
    const base = libro.offsetWidth * 0.043;
    document.querySelectorAll(".contenido").forEach(c => {
      let fs = base;
      c.style.fontSize = fs + "px";
      while (c.scrollHeight > c.clientHeight + 1 && fs > 10) {
        fs -= 0.4; c.style.fontSize = fs + "px";
      }
    });
  }
  ajustar();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajustar);
  window.addEventListener("resize", ajustar);
  foto.addEventListener("load", ajustar);

  /* ---- Pasar páginas ---- */
  let actual = 0, ocupado = false;
  let dijoSi = false, inicio = null;
  try {
    const guardado = localStorage.getItem(CLAVE);
    if (guardado) { dijoSi = true; inicio = new Date(+guardado); }
  } catch (e) {}
  if (CONFIG.fechaInicio && dijoSi) inicio = new Date(CONFIG.fechaInicio);

  const ms = v => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(v)) * 1000;
  function ordenar() {
    hojas.forEach((h, i) => { h.style.zIndex = i < actual ? 10 + i : 100 - i; });
  }
  ordenar();

  function limite() { return dijoSi ? hojas.length : hojas.length - 1; }

  function pasar(dir) {
    if (ocupado) return;
    let h;
    if (dir > 0) {
      if (actual >= limite()) { if (!dijoSi) empujarBoton(); return; }
      h = hojas[actual++];
      h.classList.add("volteada");
    } else {
      if (actual <= 1) return;
      h = hojas[--actual];
      h.classList.remove("volteada");
    }
    ocupado = true;
    const dur = h.classList.contains("tapa") ? ms("--giro-tapa") : ms("--giro-hoja");
    h.style.zIndex = 300;
    h.classList.add("girando");
    sonPagina(h.classList.contains("tapa"));
    if (actual === 1 && dir > 0) {
      libro.classList.add("abierto");
      abrirCamara();
      libro.setAttribute("aria-label", "Pasar la página");
      pista.classList.add("oculta");
      vibrar(12);
    }
    setTimeout(() => { h.classList.remove("girando"); ordenar(); ocupado = false; }, dur);
  }

  function empujarBoton() {
    $("#boton-si").animate(
      [{ transform: "scale(1)" }, { transform: "scale(1.07)" }, { transform: "scale(.98)" }, { transform: "scale(1)" }],
      { duration: 650, easing: "ease-out" });
  }

  // toque: izquierda = atrás, resto = adelante
  let deslizo = false;
  libro.addEventListener("click", e => {
    if (deslizo) { deslizo = false; return; }
    if (e.target.closest("button")) return;
    if (actual === 0) return pasar(1);
    const r = libro.getBoundingClientRect();
    pasar((e.clientX - r.left) / r.width < 0.28 ? -1 : 1);
  });
  libro.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " " || e.key === "ArrowRight") { e.preventDefault(); pasar(1); }
    if (e.key === "ArrowLeft") pasar(-1);
  });
  pista.addEventListener("click", () => { if (actual === 0) pasar(1); });

  // deslizar con el dedo
  let x0 = null, y0 = null;
  window.addEventListener("pointerdown", e => { x0 = e.clientX; y0 = e.clientY; });
  window.addEventListener("pointerup", e => {
    if (x0 == null) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3) {
      deslizo = true; setTimeout(() => (deslizo = false), 400);
      pasar(dx < 0 ? 1 : -1);
    }
  });


  /* =========================================================
     AMBIENTE: intro, libro que se inclina, polvo de luz, sonido
     ========================================================= */
  const vol = $("#volumen"), mesa = $(".mesa");
  const intro = $("#intro"), botonSonido = $("#sonido");
  function vibrar(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

  // --- inclinación 3D (giroscopio o dedo) ---
  const BASE_X = -7, BASE_Y = -18;
  let objX = 0, objY = 0, curX = 0, curY = 0, vivo = true;
  function bucle(t) {
    if (!vivo) return;
    curX += (objX - curX) * 0.06;
    curY += (objY - curY) * 0.06;
    const flota = reducido ? 0 : Math.sin(t / 1500) * 5;
    const deriva = reducido ? 0 : Math.sin(t / 2300) * 1.5;
    const ry = BASE_Y + curY + deriva, rx = BASE_X + curX;
    vol.style.transform = `translateY(${flota}px) scale(.93) rotateX(${rx}deg) rotateY(${ry}deg)`;
    vol.style.setProperty("--brillo", (62 - ry * 3) + "%");
    mesa.style.setProperty("--sx", (-ry * 1.4).toFixed(1));
    requestAnimationFrame(bucle);
  }
  requestAnimationFrame(bucle);
  const lim = (v, a) => Math.max(-a, Math.min(a, v));
  window.addEventListener("pointermove", e => {
    if (e.pointerType === "touch" && e.buttons === 0) return;
    objY = (e.clientX / innerWidth - 0.5) * 22;
    objX = -(e.clientY / innerHeight - 0.5) * 14;
  });
  window.addEventListener("pointerup", e => { if (e.pointerType === "touch") { objX = 0; objY = 0; } });
  function escucharGiro() {
    window.addEventListener("deviceorientation", e => {
      if (e.gamma == null) return;
      objY = lim(e.gamma, 30) / 30 * 14;
      objX = -lim(e.beta - 50, 30) / 30 * 9;
    });
  }
  function abrirCamara() {
    vivo = false;
    vol.classList.add("abierto");
    vol.style.transition = "transform 1.8s cubic-bezier(.45,.05,.25,1)";
    vol.style.transform = "translateX(calc(var(--w) * .05))";
    mesa.style.setProperty("--sx", 0);
    document.body.classList.add("leyendo");
  }

  // --- polvo de luz flotando ---
  (function polvo() {
    const c = $("#polvo"), ctx = c.getContext("2d");
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    let W, H;
    const tam = () => { W = c.width = innerWidth * dpr; H = c.height = innerHeight * dpr; };
    tam(); window.addEventListener("resize", tam);
    const punto = document.createElement("canvas"); punto.width = punto.height = 32;
    const pc = punto.getContext("2d");
    const g = pc.createRadialGradient(16, 16, 0, 16, 16, 16);
    g.addColorStop(0, "rgba(255,244,220,1)"); g.addColorStop(.35, "rgba(255,236,200,.5)"); g.addColorStop(1, "rgba(255,236,200,0)");
    pc.fillStyle = g; pc.fillRect(0, 0, 32, 32);
    const motas = Array.from({ length: reducido ? 12 : 42 }, () => ({
      x: Math.random(), y: Math.random(), r: 2 + Math.random() * 7, a: .15 + Math.random() * .45,
      v: .00006 + Math.random() * .00018, f: Math.random() * 6.28, z: .3 + Math.random()
    }));
    function dibujar(t) {
      ctx.clearRect(0, 0, W, H);
      for (const m of motas) {
        m.y -= m.v * (reducido ? 0 : 1); if (m.y < -0.05) { m.y = 1.05; m.x = Math.random(); }
        const x = (m.x + Math.sin(t / 3000 + m.f) * .015 + curY * .0015 * m.z) * W;
        const y = (m.y - curX * .0015 * m.z) * H;
        ctx.globalAlpha = m.a * (.6 + .4 * Math.sin(t / 900 + m.f));
        const d = m.r * dpr * 2;
        ctx.drawImage(punto, x - d / 2, y - d / 2, d, d);
      }
      requestAnimationFrame(dibujar);
    }
    requestAnimationFrame(dibujar);
  })();

  // --- sonido: pasar página, campanitas y cajita de música ---
  let ac = null, maestro = null, sonidoOn = true, ruidoBuf = null;
  function iniciarAudio() {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      maestro = ac.createGain(); maestro.gain.value = 1; maestro.connect(ac.destination);
      ruidoBuf = ac.createBuffer(1, ac.sampleRate * 1.2, ac.sampleRate);
      const d = ruidoBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      musica();
    } catch (e) { ac = null; }
  }
  function sonPagina(tapa) {
    if (!ac) return;
    const t = ac.currentTime + (tapa ? 0.15 : 0);
    const src = ac.createBufferSource(); src.buffer = ruidoBuf;
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = .9;
    bp.frequency.setValueAtTime(tapa ? 1800 : 3200, t);
    bp.frequency.exponentialRampToValueAtTime(600, t + (tapa ? .9 : .45));
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(tapa ? .32 : .2, t + .06);
    g.gain.exponentialRampToValueAtTime(.001, t + (tapa ? 1 : .5));
    src.connect(bp); bp.connect(g); g.connect(maestro);
    src.start(t); src.stop(t + 1.1);
    if (tapa) { // la tapa se apoya
      const o = ac.createOscillator(), og = ac.createGain();
      o.frequency.setValueAtTime(110, t + 1.25); o.frequency.exponentialRampToValueAtTime(45, t + 1.5);
      og.gain.setValueAtTime(0, t + 1.25); og.gain.linearRampToValueAtTime(.25, t + 1.27); og.gain.exponentialRampToValueAtTime(.001, t + 1.6);
      o.connect(og); og.connect(maestro); o.start(t + 1.2); o.stop(t + 1.7);
    }
  }
  function campana(f, t, vol, dur) {
    const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = f; o2.frequency.value = f * 2.01; o2.type = "sine";
    const g2 = ac.createGain(); g2.gain.value = .25;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .008);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(eco || maestro);
    o.start(t); o2.start(t); o.stop(t + dur + .05); o2.stop(t + dur + .05);
  }
  let eco = null;
  function musica() {
    // eco suave
    const d = ac.createDelay(); d.delayTime.value = .38;
    const fb = ac.createGain(); fb.gain.value = .32;
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2600;
    eco = ac.createGain(); eco.gain.value = .9;
    eco.connect(maestro); eco.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(maestro);
    const m = n => 440 * Math.pow(2, (n - 69) / 12);
    const acordes = [[74, 78, 81, 86], [69, 73, 76, 81], [71, 74, 78, 83], [67, 71, 74, 79]]; // Re, La, Si m, Sol
    const patron = [0, 2, 1, 3, 2, 1, 0, 2];
    const paso = .46;
    let siguiente = ac.currentTime + .3, i = 0;
    setInterval(() => {
      if (!ac) return;
      while (siguiente < ac.currentTime + .6) {
        const compas = Math.floor(i / 8) % 4, nota = patron[i % 8];
        const ac_ = acordes[compas];
        if (i % 8 === 0) campana(m(ac_[0] - 24), siguiente, .05, 3.2);
        if (Math.random() > .12) campana(m(ac_[nota]), siguiente, .045 + Math.random() * .02, 1.8);
        siguiente += paso; i++;
      }
    }, 120);
  }
  function sonCampanas() {
    if (!ac) return;
    const t = ac.currentTime;
    [88, 93, 95, 100, 105].forEach((n, k) => campana(440 * Math.pow(2, (n - 69) / 12), t + k * .11, .09, 2.4));
  }
  botonSonido.addEventListener("click", e => {
    e.stopPropagation();
    sonidoOn = !sonidoOn;
    botonSonido.classList.toggle("mudo", !sonidoOn);
    if (ac) maestro.gain.setTargetAtTime(sonidoOn ? 1 : 0, ac.currentTime, .15);
  });

  // --- intro ---
  let empezado = false;
  function empezar() {
    if (empezado) return;
    empezado = true;
    iniciarAudio();
    try {
      if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function") {
        DeviceOrientationEvent.requestPermission().then(p => { if (p === "granted") escucharGiro(); }).catch(() => {});
      } else escucharGiro();
    } catch (e) {}
    intro.classList.add("fuera");
    document.body.classList.add("listo");
  }
  intro.addEventListener("click", empezar);

  /* ---- "Sí, quiero" ---- */
  $("#boton-si").addEventListener("click", e => {
    e.stopPropagation();
    if (ocupado) return;
    if (!inicio) {
      inicio = CONFIG.fechaInicio ? new Date(CONFIG.fechaInicio) : new Date();
      try { localStorage.setItem(CLAVE, String(inicio.getTime())); } catch (err) {}
    }
    dijoSi = true;
    e.currentTarget.classList.add("dicho");
    iniciarContador();
    lluviaDePetalos();
    sonCampanas();
    vibrar([30, 60, 30, 60, 80]);
    setTimeout(() => pasar(1), 1300);
  });

  /* ---- Contador ---- */
  let reloj = null;
  function iniciarContador() {
    const f = new Intl.DateTimeFormat("es", { day: "numeric", month: "long", year: "numeric" }).format(inicio);
    $("#fecha-inicio").textContent = "Desde el " + f;
    const dd = $("#c-dias"), hh = $("#c-horas"), mm = $("#c-minutos"), ss = $("#c-segundos");
    const dos = n => String(n).padStart(2, "0");
    const tic = () => {
      let s = Math.max(0, Math.floor((Date.now() - inicio.getTime()) / 1000));
      dd.textContent = Math.floor(s / 86400); s %= 86400;
      hh.textContent = dos(Math.floor(s / 3600)); s %= 3600;
      mm.textContent = dos(Math.floor(s / 60));
      ss.textContent = dos(s % 60);
    };
    tic();
    clearInterval(reloj);
    reloj = setInterval(tic, 1000);
  }
  if (dijoSi) iniciarContador();

  /* ---- Pétalos de rosa ---- */
  const COLORES = [
    ["#fbe1e3", "#eea5b1", "#d77689"],
    ["#f9d3d8", "#e78f9f", "#c9647a"],
    ["#fdeceb", "#f2bcc3", "#e091a0"],
    ["#f6c3cb", "#de7f93", "#b9566d"]
  ];
  const capa = $("#petalos");

  function petalo() {
    const p = document.createElement("div");
    p.className = "petalo";
    const t = 12 + Math.random() * 14;
    const c = COLORES[(Math.random() * COLORES.length) | 0];
    p.style.width = t + "px";
    p.style.height = t * (0.8 + Math.random() * 0.3) + "px";
    p.style.background = `radial-gradient(circle at 35% 30%, ${c[0]}, ${c[1]} 55%, ${c[2]})`;
    p.style.opacity = 0.75 + Math.random() * 0.25;
    capa.appendChild(p);

    const W = innerWidth, H = innerHeight;
    const x = Math.random() * W, deriva = (Math.random() - 0.5) * 160;
    const r0 = Math.random() * 360, giro = (Math.random() > .5 ? 1 : -1) * (180 + Math.random() * 360);
    const oscila = 25 + Math.random() * 35;
    const pasos = [];
    for (let k = 0; k <= 6; k++) {
      const f = k / 6;
      pasos.push({
        transform: `translate(${x + deriva * f + Math.sin(f * Math.PI * 3) * oscila}px, ${-40 + (H + 80) * f}px) rotate(${r0 + giro * f}deg) rotateX(${f * 540}deg)`
      });
    }
    const a = p.animate(pasos, { duration: 4200 + Math.random() * 3200, easing: "cubic-bezier(.35,.1,.55,1)" });
    a.onfinish = () => p.remove();
  }

  function lluviaDePetalos() {
    const n = reducido ? 18 : 110;
    for (let i = 0; i < n; i++) setTimeout(petalo, i * 55 + Math.random() * 300);
  }
})();
</script>
